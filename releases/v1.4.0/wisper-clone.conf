# Legacy hyprlang configuration (before Hyprland 0.55).
# Add to ~/.config/hypr/hyprland.conf: source = ~/.config/hypr/wisper-clone.conf
$wisper = ~/.local/bin/wisper-clone
bindr = CTRL SHIFT, S, exec, $wisper --control toggle
bindr = , F9, exec, $wisper --control paste-last
# Legacy config cannot attach ordered PTT session tokens; use toggle instead.
bindr = , F8, exec, $wisper --control toggle
bind = CTRL SHIFT, K, exec, $wisper --control command-palette
bindr = CTRL SHIFT, slash, exec, $wisper --control voice-note
windowrulev2 = float, title:^(Wisper Clone Indicator)$
windowrulev2 = pin, title:^(Wisper Clone Indicator)$
windowrulev2 = nofocus, title:^(Wisper Clone Indicator)$
windowrulev2 = move 50%-40 100%-80, title:^(Wisper Clone Indicator)$
exec-once = $wisper --autostart
