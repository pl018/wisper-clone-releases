# Legacy hyprlang configuration (before Hyprland 0.55).
# Add to ~/.config/hypr/hyprland.conf: source = ~/.config/hypr/wisper-clone.conf
$wisper = ~/.local/bin/wisper-clone
bindr = ALT, space, exec, $wisper --control toggle
bindr = , F9, exec, $wisper --control paste-last
# Legacy config cannot attach ordered PTT session tokens; use toggle instead.
bindr = , F8, exec, $wisper --control toggle
bind = ALT, K, exec, $wisper --control command-palette
bindr = ALT, N, exec, $wisper --control voice-note
windowrulev2 = float, title:^(Wisper Clone Indicator)$
windowrulev2 = pin, title:^(Wisper Clone Indicator)$
# noinitialfocus rather than nofocus, which also blocks mouse input to the pill.
windowrulev2 = noinitialfocus, title:^(Wisper Clone Indicator)$
windowrulev2 = noborder, title:^(Wisper Clone Indicator)$
windowrulev2 = noshadow, title:^(Wisper Clone Indicator)$
# XWayland (the AppImage) restores the dragged position itself.
windowrulev2 = nofocus, title:^(Wisper Clone Indicator)$, xwayland:0
windowrulev2 = move 50%-40 100%-80, title:^(Wisper Clone Indicator)$, xwayland:0
exec-once = $wisper --autostart
